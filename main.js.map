<section class="project-list-section">
    <div class="container">
        <div class="list-header">
            <h2>Games Developed</h2>
            <p class="back-link"><a routerLink="/portfolio">&larr; Back to Portfolio</a></p>
            <div class="list-intro">
                <p>A showcase of games I've developed, primarily built with Unity. These projects demonstrate my game design and development skills across various genres and platforms.</p>
            </div>
        </div>

        <div class="search-filter">
            <div class="search-box">
                <input type="text" placeholder="Search games..." (input)="searchGames($event)">
                <span class="search-icon">🔍</span>
            </div>
        </div>        
        
        <div class="project-list">
            <div class="project-item game-item" *ngFor="let game of filteredGames; let idx = index">
                <div class="project-image">
                    <img [src]="game.profile" [alt]="game.title" (error)="onImageError($event)">
                </div>
                <div class="project-details">
                    <h3>{{game.title}}</h3>
                    <p>{{game.summary}}</p>
                    <div class="project-actions">
                        <a routerLink="/projects/games/{{idx}}" class="view-project-btn">
                            View Details <span class="arrow">→</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- No results message -->
            <div class="no-results" *ngIf="filteredGames.length === 0">
                <p>No games match your search criteria.</p>
            </div>
        </div>
    </div>
</section>
